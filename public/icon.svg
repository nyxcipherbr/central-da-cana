<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4623" />
      <stop offset="100%" stop-color="#0c2610" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce744" />
      <stop offset="100%" stop-color="#e5b608" />
    </linearGradient>
    <linearGradient id="cane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64c36c" />
      <stop offset="100%" stop-color="#2f8737" />
    </linearGradient>
  </defs>
  
  <!-- Fundo Arredondado -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  
  <!-- Círculo interno dourado suave -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.4" />
  
  <!-- Varas de Cana de Açúcar estilizadas -->
  <g transform="translate(180, 100) rotate(-15)">
    <!-- Tronco de cana 1 -->
    <rect x="0" y="20" width="45" height="280" rx="10" fill="url(#cane)" stroke="#1e4623" stroke-width="4"/>
    <!-- Nós da cana -->
    <line x1="0" y1="80" x2="45" y2="80" stroke="#fce744" stroke-width="6" />
    <line x1="0" y1="150" x2="45" y2="150" stroke="#fce744" stroke-width="6" />
    <line x1="0" y1="220" x2="45" y2="220" stroke="#fce744" stroke-width="6" />
  </g>
  
  <g transform="translate(260, 110) rotate(15)">
    <!-- Tronco de cana 2 -->
    <rect x="0" y="20" width="45" height="280" rx="10" fill="url(#cane)" stroke="#1e4623" stroke-width="4"/>
    <!-- Nós da cana -->
    <line x1="0" y1="70" x2="45" y2="70" stroke="#fce744" stroke-width="6" />
    <line x1="0" y1="140" x2="45" y2="140" stroke="#fce744" stroke-width="6" />
    <line x1="0" y1="210" x2="45" y2="210" stroke="#fce744" stroke-width="6" />
  </g>
  
  <!-- Copo de Garapa Gelada estilizado na frente -->
  <g transform="translate(176, 210)">
    <path d="M 20 60 L 40 210 Q 80 230 120 210 L 140 60 Z" fill="#fdf488" stroke="#ffffff" stroke-width="6" />
    <path d="M 25 75 L 42 200 Q 80 218 118 200 L 135 75 Z" fill="url(#gold)" opacity="0.9" />
    <!-- Cubos de Gelo -->
    <rect x="50" y="90" width="28" height="28" rx="6" fill="#ffffff" opacity="0.75" transform="rotate(10 64 104)" />
    <rect x="85" y="115" width="24" height="24" rx="5" fill="#ffffff" opacity="0.75" transform="rotate(-15 97 127)" />
    <!-- Canudo -->
    <line x1="120" y1="20" x2="70" y2="170" stroke="#ef4444" stroke-width="12" stroke-linecap="round" />
  </g>
  
  <!-- Texto Central da Cana -->
  <text x="256" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#fce744" letter-spacing="2">CENTRAL DA CANA</text>
</svg>
